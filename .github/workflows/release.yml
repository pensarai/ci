# Release Workflow
# Triggered on pushes to main - publishes to npm when package.json version changes
# Automatically creates a git tag and GitHub release

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for re-runs

# Two pushes publishing at once would race on the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and its tag
      id-token: write # npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # v4 caches only when `cache` is set, and it is not.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org" # zizmor: ignore[cache-poisoning]

      - name: Check if version is already published
        id: check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          # Check if this version already exists on npm
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$LOCAL_VERSION" version 2>/dev/null || echo "")

          if [ "$PUBLISHED_VERSION" = "$LOCAL_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published — skipping release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $LOCAL_VERSION is not yet published — will release."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        if: steps.check.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PACKAGE: ${{ steps.check.outputs.package }}
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to v$VERSION"
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD --no-merges)
          else
            echo "No previous tag found, listing recent commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20 --no-merges)
          fi

          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "npm install $PACKAGE@$VERSION"
            echo '```'
          } > release_notes.md

      # The release API creates the tag on this commit, so nothing is pushed
      # from the runner.
      - name: Create the GitHub release and its tag
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping."
            exit 0
          fi
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes-file release_notes.md --prerelease="$prerelease" --latest=$([ "$prerelease" = true ] && echo false || echo true)
