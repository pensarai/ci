# Pensar Security Pentest for GitLab CI
# Add this to your .gitlab-ci.yml or include it as a template
#
# The PENSAR_API_KEY determines the workspace. GitLab does not expose a GitHub
# repository id, so these run workspace-wide; pass `--repo-id <id>` to scope to
# a single repository.

stages:
  - test
  - security

# Run on merge requests
pensar-pentest-mr:
  stage: security
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm install -g @pensar/ci
  script:
    - pensar pentest --branch $CI_COMMIT_REF_NAME
  variables:
    PENSAR_API_KEY: $PENSAR_API_KEY

# Run on commits to main branches
pensar-pentest-push:
  stage: security
  image: node:20
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  before_script:
    - npm install -g @pensar/ci
  script:
    - pensar pentest --branch $CI_COMMIT_REF_NAME
  variables:
    PENSAR_API_KEY: $PENSAR_API_KEY

# Run after deployment (triggered by upstream pipeline)
pensar-pentest-post-deploy:
  stage: security
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" # Triggered by another pipeline
  before_script:
    - npm install -g @pensar/ci
  script:
    - echo "Running security pentest after deployment..."
    - pensar pentest --branch $CI_COMMIT_REF_NAME
  variables:
    PENSAR_API_KEY: $PENSAR_API_KEY
